name: Release

# Pushing a version tag builds the Windows and Mac installers and publishes both
# to one GitHub Release, so https://github.com/Snehil1123/lord-of-my-life/releases
# always has the latest downloads.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# It can also be run by hand from the Actions tab (Run workflow):
#   - with a version, e.g. 0.7.0, it builds and publishes v0.7.0 itself,
#     creating the tag — so releasing needs no tag push, which matters where
#     tags can't be pushed. An existing release of that version gets its
#     files replaced, which is also how a broken release is repaired.
#   - with the version left empty it only builds; the installers are
#     downloadable from the run's Artifacts and nothing is published.
#
# Needs repo secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   — sign-in and shared rooms
#   VITE_GOOGLE_CLIENT_ID, VITE_GOOGLE_CLIENT_SECRET — Google Calendar
# Vite inlines these into the bundle at build time. Missing ones just disable
# that feature; the app still builds and runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.7.0 (no v). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write # the publish job creates the release

env:
  # vX.Y.Z when this run publishes, empty for a test build
  RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the Agent SDK's ~293MB platform binary as an optional
      # dependency; that's most of the install time and most of the installer.
      - run: npm ci

      # The release version comes from the tag, so package.json never has to be
      # edited by hand. Skipped on a manual run, which just uses what's committed.
      - name: Set version from tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $RELEASE_TAG"; exit 1; }
          npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"

      - name: Write .env.local
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
            echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}"
          } > .env.local

      - run: npm run build

      # Code signing is optional and off unless the AZURE_SIGN_* secrets exist.
      # Unsigned is fine for SmartScreen (users click "Run anyway") but Windows
      # Smart App Control blocks unsigned installers outright, with no bypass —
      # a valid signature is the only thing that clears it.
      #
      # To turn it on: create an Azure Trusted Signing account + certificate
      # profile, then add these repo secrets:
      #   AZURE_SIGN_ENDPOINT   https://<region>.codesigning.azure.net
      #   AZURE_SIGN_ACCOUNT    the Trusted Signing account name
      #   AZURE_SIGN_PROFILE    the certificate profile name
      #   AZURE_SIGN_PUBLISHER  the subject name on the certificate, exactly
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
      #     — a service principal with the "Trusted Signing Certificate Profile
      #       Signer" role; electron-builder reads these three from the env.
      - name: Package
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          set -euo pipefail
          if [ -n "${SIGN_ENDPOINT:-}" ]; then
            echo "Signing with Azure Trusted Signing."
            npx electron-builder --win --publish never \
              -c.win.azureSignOptions.endpoint="$SIGN_ENDPOINT" \
              -c.win.azureSignOptions.codeSigningAccountName="$SIGN_ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$SIGN_PROFILE" \
              -c.win.azureSignOptions.publisherName="$SIGN_PUBLISHER"
            cat > notes-win.md <<'EOF'
          Download the .exe below and run it.

          Already have it installed? You don't need this page — the app offers the
          update to you directly.
          EOF
          else
            # An unsigned build has no publisher for electron-updater to check the
            # downloaded installer against, and it refuses the update rather than
            # skipping the check. Signed builds keep the verification.
            echo "No AZURE_SIGN_* secrets set — building unsigned."
            npx electron-builder --win --publish never -c.win.verifyUpdateCodeSignature=false
            cat > notes-win.md <<'EOF'
          Download the .exe below and run it.

          **You should only need this page once.** From this version on, the app
          checks for updates itself and offers them in the header — downloading a
          new .exe by hand is no longer part of the routine.

          This build isn't code-signed, so Windows will push back the first time:

          - **"Windows protected your PC"** — choose **More info -> Run anyway**.
          - **Smart App Control blocked this app** — there is no bypass for this
            one. Smart App Control only runs signed or already-known software.
            You can turn it off under Windows Security -> App & browser control
            -> Smart App Control, but note that turning it off is permanent:
            re-enabling it requires reinstalling Windows.
          EOF
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # latest.yml is the feed electron-updater reads — without it an installed
          # copy can never discover a new version. The .blockmap lets it fetch only
          # the changed parts of a 160MB installer rather than all of it.
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            notes-win.md
          if-no-files-found: error

  # Apple Silicon only: the Agent SDK's runtime is installed per chip, so each
  # architecture needs its own runner, and Intel Macs are a shrinking minority.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set version from tag
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $RELEASE_TAG"; exit 1; }
          npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"

      - name: Write .env.local
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
            echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}"
          } > .env.local

      - run: npm run build

      # Ad-hoc signed, not Developer ID signed (mac.identity "-" in package.json).
      # Apple Silicon won't launch code with no signature at all, and a download
      # with a broken one is reported as "damaged" with no way past it; an ad-hoc
      # one gets the "Open Anyway" button in Privacy & Security instead. Auto
      # discovery is off so a runner's stray certificate can't be picked up.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --publish never

      # Cheap proof the bundle is intact before anyone downloads it: the seal
      # verifies, and the assistant's runtime — re-signed along with everything
      # else — still executes from where the packaged app will spawn it.
      - name: Verify
        run: |
          set -euo pipefail
          app=$(ls -d release/mac-arm64/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          bin="$app/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude"
          test -x "$bin"
          "$bin" --version

      - name: Release notes
        run: |
          cat > notes-mac.md <<'EOF'
          ### Mac (Apple Silicon)

          Download the `.dmg`, open it, and drag Lord of My Life into Applications.

          This build isn't signed by an Apple developer account, so macOS stops it
          the first time you open it. Click **Done**, then go to **System Settings ->
          Privacy & Security**, scroll down to the message about Lord of My Life, and
          click **Open Anyway**. You only need to do this once.

          The app tells you when a new version is out, but on Mac it can't install
          it itself: download the new `.dmg` and drag it into Applications again,
          replacing the old one. Your planner data is kept.

          Intel Macs aren't supported by this build.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          # the .zip is what electron-updater's Mac feed (latest-mac.yml) points
          # at; it is only read here to learn that a version exists
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            notes-mac.md
          if-no-files-found: error

  # One job creates the release and attaches everything. Each build publishing
  # its own files would race to create the release, which is how one tag once
  # ended up with two. Publishing by hand rather than with electron-builder's
  # own publisher, which creates the release as a draft by default.
  #
  # A failed Mac build doesn't hold back Windows: the release goes out with
  # whatever built, and a Mac rerun of the same tag adds its files afterwards.
  publish:
    needs: [windows, mac]
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') && (needs.windows.result == 'success' || needs.mac.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd out
          : > notes.md
          [ -f notes-win.md ] && { echo "### Windows"; echo; cat notes-win.md; echo; } >> notes.md
          [ -f notes-mac.md ] && cat notes-mac.md >> notes.md
          # each artifact keeps the paths it was uploaded with, so the installers
          # arrive under release/ beside the notes, not next to them
          assets=(release/*.exe release/*.dmg release/*.zip release/*.blockmap release/latest*.yml)
          # a release with notes and no files is worse than a failed run
          [ ${#assets[@]} -gt 0 ] || { echo "No installers found to publish."; exit 1; }
          echo "Publishing:"; ls -lh "${assets[@]}" | awk '{print "  " $9 "  " $5}'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            # --target creates the tag at this commit when it doesn't exist yet
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file notes.md
          fi
