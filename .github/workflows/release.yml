name: Release

# Pushing a version tag builds the Windows installer and publishes it to
# GitHub Releases, so https://github.com/Snehil1123/lord-of-my-life/releases
# always has the latest download.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Needs repo secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   — sign-in and shared rooms
#   VITE_GOOGLE_CLIENT_ID, VITE_GOOGLE_CLIENT_SECRET — Google Calendar
# Vite inlines these into the bundle at build time. Missing ones just disable
# that feature; the app still builds and runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # lets you re-run a build by hand from the Actions tab

permissions:
  contents: write # electron-builder needs this to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the Agent SDK's ~293MB platform binary as an optional
      # dependency; that's most of the install time and most of the installer.
      - run: npm ci

      # The release version comes from the tag, so package.json never has to be
      # edited by hand. Skipped on a manual run, which just uses what's committed.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Write .env.local
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
            echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}"
          } > .env.local

      - run: npm run build

      # Code signing is optional and off unless the AZURE_SIGN_* secrets exist.
      # Unsigned is fine for SmartScreen (users click "Run anyway") but Windows
      # Smart App Control blocks unsigned installers outright, with no bypass —
      # a valid signature is the only thing that clears it.
      #
      # To turn it on: create an Azure Trusted Signing account + certificate
      # profile, then add these repo secrets:
      #   AZURE_SIGN_ENDPOINT   https://<region>.codesigning.azure.net
      #   AZURE_SIGN_ACCOUNT    the Trusted Signing account name
      #   AZURE_SIGN_PROFILE    the certificate profile name
      #   AZURE_SIGN_PUBLISHER  the subject name on the certificate, exactly
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
      #     — a service principal with the "Trusted Signing Certificate Profile
      #       Signer" role; electron-builder reads these three from the env.
      - name: Package
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          set -euo pipefail
          if [ -n "${SIGN_ENDPOINT:-}" ]; then
            echo "Signing with Azure Trusted Signing."
            npx electron-builder --win --publish never \
              -c.win.azureSignOptions.endpoint="$SIGN_ENDPOINT" \
              -c.win.azureSignOptions.codeSigningAccountName="$SIGN_ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$SIGN_PROFILE" \
              -c.win.azureSignOptions.publisherName="$SIGN_PUBLISHER"
            cat > notes.md <<'EOF'
          Windows installer. Download the .exe below and run it.

          Already have it installed? You don't need this page — the app offers the
          update to you directly.
          EOF
          else
            # An unsigned build has no publisher for electron-updater to check the
            # downloaded installer against, and it refuses the update rather than
            # skipping the check. Signed builds keep the verification.
            echo "No AZURE_SIGN_* secrets set — building unsigned."
            npx electron-builder --win --publish never -c.win.verifyUpdateCodeSignature=false
            cat > notes.md <<'EOF'
          Windows installer. Download the .exe below and run it.

          This build isn't code-signed, so Windows will push back:

          - **"Windows protected your PC"** — choose **More info -> Run anyway**.
          - **Smart App Control blocked this app** — there is no bypass for this
            one. Smart App Control only runs signed or already-known software.
            You can turn it off under Windows Security -> App & browser control
            -> Smart App Control, but note that turning it off is permanent:
            re-enabling it requires reinstalling Windows.
          EOF
          fi

      # Publishing by hand rather than with electron-builder's own publisher:
      # that one creates the release as a *draft* by default (invisible to the
      # people you share the link with) and raced with itself uploading multiple
      # artifacts, ending up with two release objects for one tag. Creating the
      # release explicitly is deterministic. latest.yml and the .blockmap go up
      # too: they are the auto-update feed an installed copy reads.
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # latest.yml is the feed electron-updater reads — without it an installed
          # copy can never discover a new version. The .blockmap lets it fetch only
          # the changed parts of a 160MB installer rather than all of it.
          assets=$(ls release/*.exe release/*.exe.blockmap release/latest.yml)
          echo "Publishing:"; ls -lh $assets | awk '{print "  " $9 "  " $5}'
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" $assets \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
